services:
  - type: web
    name: dispute-defender
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: dispute-defender-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: APP_MODE
        value: sandbox
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ACCESS_KEY
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: llm
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: AI_EXTRACTION
        value: vision
      - key: AI_VISION_MODEL
        value: gpt-4.1-mini
